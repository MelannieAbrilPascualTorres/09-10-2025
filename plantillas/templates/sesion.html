{% extends "base.html" %}

{% block titulo %}Iniciar sesion{% endblock %}

{% block contenido %}

<section class="container-fluid">
    <h1 class="text-center text-primary">Iniciar sesion</h1>
    <section class="row justify-content-center">
        <div class="col-12 col-md-6">
            <form method="POST" action="/validaSesion">
                <section class="row">
                    <div class=" col-12 mb-3">
                        <label for="email" class="form-label">Correo </label>
                        <input type="email" required class="form-control" id="email" name="email" placeholder="Ingrese su correo">
                    </div>
                </section>

                <section class="row">
                    <div class="col-12 mb-3">
                        <label for="password" class="form-label">Contraseña </label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contaseña">
                    </div>
                </section>

                <section class="row text-center mb-3">
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Iniciar sesion</button>
                    </div>
                    <div class="col-12 mt-2">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </section>

            </form>
        </div>
    </section>
</section>

{% endblock %}
